[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icu-monitor"
version = "2.0.0"
description = "Real-time ICU patient deterioration monitoring: clinical early-warning scoring, ML risk stratification, and computer-vision bedside safety."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Guna Rithvick" }]
keywords = ["icu", "healthcare", "machine-learning", "monitoring", "news2", "computer-vision"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "SQLAlchemy>=2.0",
    "streamlit>=1.36",
    "altair>=5.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.26",
]

[project.optional-dependencies]
vision = [
    "opencv-python-headless>=4.9",
    "ultralytics>=8.1",
]
postgres = [
    "psycopg[binary]>=3.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.scripts]
icu-monitor = "icu_monitor.cli:main"

[project.urls]
Homepage = "https://github.com/gunarithvick/icu-patient-risk-monitoring-system"
Issues = "https://github.com/gunarithvick/icu-patient-risk-monitoring-system/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
icu_monitor = ["ui/assets/*.css"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["src/icu_monitor"]
omit = ["*/ui/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # the formatter owns line breaks; it cannot always reach 100 (long URLs, tables)
    "B008",    # FastAPI's whole idiom is Depends()/Query() in a default argument
    "RUF012",  # ClassVar on Pydantic model_config would be wrong
    # This codebase writes clinical text: SpO₂, ≥, °C, 37.5 °C–38.0 °C, "7 channels × 6
    # aggregates". Those characters are the correct ones for a nurse to read, and the
    # UTF-8 stream handling in logging_setup.py exists precisely so they survive. The
    # ambiguous-unicode rules would have us spell them ASCII; declining once here beats
    # a noqa on every clinical string.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]
"src/icu_monitor/ui/*" = ["E402"]
# scikit-learn's own signature is fit(X, y): a capital X for the design matrix and a
# lowercase y for the target. Renaming it to please pep8-naming would make this code read
# unlike every estimator it wraps.
"src/icu_monitor/ml/*" = ["N803"]
