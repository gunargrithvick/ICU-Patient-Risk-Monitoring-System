name: CI

# Four jobs, in rough order of how fast they tell you something useful:
#
#   lint    - ruff check + format, seconds
#   test    - the suite across the Python versions pyproject claims, plus Windows
#   smoke   - install the wheel and actually run the thing: CLI, then the live API
#   docker  - build the image and prove the container answers /health
#
# `smoke` is the job that earns the phrase "end to end deployable". A green test suite says
# the units agree with each other; only starting the process says the install works.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The codebase logs SpO₂, ≥ and °C. Runners are UTF-8 by default; the Windows leg is not.
  PYTHONIOENCODING: utf-8
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Ruff only; no need to resolve numpy/pandas to check import order.
      - run: pip install "ruff==0.14.5"

      - name: ruff check
        run: ruff check src tests --output-format=github

      - name: ruff format
        run: ruff format --check src tests

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every version `requires-python = ">=3.10"` promises, on Linux; plus one Windows
        # leg, because the UTF-8 stream reconfiguration in logging_setup.py exists for a
        # bug that only reproduces on a cp1252 console and would otherwise go unnoticed.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The vision extra is not installed anywhere in this matrix, on purpose: the suite
      # has to pass with the NumPy fallback detector, because that is what a slim container
      # and a hosted Streamlit runtime actually get.
      - name: pytest
        run: pytest tests/ --cov --cov-report=xml --cov-report=term-missing

      - name: upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  smoke:
    name: smoke (installed wheel)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # A built wheel, not an editable install: this is the artefact a deployment gets, and
      # it is where a missing entry in [tool.setuptools.package-data] shows up.
      - name: build and install the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          pip install dist/*.whl

      - name: settings and readiness resolve
        run: icu-monitor info

      # No trained artefact exists in a fresh clone. The ward must still tick, and the
      # snapshot must still carry a composite score, on NEWS2 and vision alone.
      - name: the ward ticks without a model
        run: icu-monitor tick --ticks 5 --json > snapshot.json

      - name: the snapshot is well-formed
        run: |
          python - <<'PY'
          import json, pathlib, sys

          snapshot = json.loads(pathlib.Path("snapshot.json").read_text(encoding="utf-8"))
          beds = snapshot["beds"]
          assert beds, "no beds in the snapshot"
          assert snapshot["tick"] >= 5, snapshot["tick"]
          for bed in beds:
              assessment = bed["assessment"]
              assert assessment["level"], bed
              assert assessment["composite_score"] is not None, bed
          print(f"ok: {len(beds)} beds, tick {snapshot['tick']}, "
                f"mean score {snapshot['mean_score']:.1f}")
          PY

      - name: train a model on a synthetic cohort
        run: |
          icu-monitor etl --synthetic --stays 120
          icu-monitor train --splits 2 --no-importances

      # The API is started in the background and probed over HTTP, because "it imports" and
      # "it serves" are different claims and only the second one matters to a deployment.
      - name: serve, then probe every operational route
        env:
          ICU_API_KEY: smoke-test-key
          ICU_API_PORT: "8000"
          ICU_API_WARMUP_TICKS: "3"
        run: |
          icu-monitor serve --port 8000 &
          for _ in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 && break
            sleep 1
          done

          echo "--- /health"
          curl -fsS http://127.0.0.1:8000/health
          echo "--- /ready"
          curl -fsS http://127.0.0.1:8000/ready
          echo "--- /metrics (icu_ lines)"
          curl -fsS http://127.0.0.1:8000/metrics | grep '^icu_'

          # ICU_API_KEY is set, so the ward is closed and the probes are not. Both halves
          # of that sentence are asserted, in the order that fails loudly.
          echo "--- /api/v1/ward without a key must be 401"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/ward)
          test "$code" = "401" || { echo "expected 401, got $code"; exit 1; }

          echo "--- /api/v1/ward with the key must be 200"
          curl -fsS -H "X-API-Key: smoke-test-key" \
            "http://127.0.0.1:8000/api/v1/ward?force=true" >/dev/null

          echo "--- stateless scoring, model included"
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/risk/score \
            -H "X-API-Key: smoke-test-key" -H 'Content-Type: application/json' \
            -d '{"vitals":{"heart_rate":128,"spo2":89,"bp_systolic":86,"resp_rate":28,
                 "temperature":38.9,"consciousness":"voice"},"patient_id":"SMOKE"}'
          echo

      - name: the dashboard script imports under Streamlit's runtime
        run: |
          python - <<'PY'
          # Importing the module is not the same as rendering it, but it is the check that
          # catches the failure that actually happens: a bad import or a module-level
          # Streamlit call in a view. AppTest renders it for real in tests/.
          import importlib

          for module in (
              "icu_monitor.ui.app",
              "icu_monitor.ui.theme",
              "icu_monitor.ui.charts",
              "icu_monitor.ui.components",
              "icu_monitor.ui.views.overview",
              "icu_monitor.ui.views.patient",
              "icu_monitor.ui.views.alerts",
              "icu_monitor.ui.views.model",
              "icu_monitor.ui.views.settings",
          ):
              importlib.import_module(module)
              print(f"ok  {module}")
          PY

  docker:
    name: docker image
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Loaded into the local daemon rather than pushed: this job proves the image builds
      # and answers, it does not publish anything.
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: icu-monitor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: the container serves and reports healthy
        run: |
          docker run -d --name icu-ci -p 8000:8000 \
            -e ICU_API_WARMUP_TICKS=3 icu-monitor:ci

          for _ in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' icu-ci 2>/dev/null || echo starting)
            [ "$status" = "healthy" ] && break
            [ "$status" = "unhealthy" ] && { docker logs icu-ci; exit 1; }
            sleep 2
          done
          test "$status" = "healthy" || { docker logs icu-ci; exit 1; }

          curl -fsS http://127.0.0.1:8000/ready
          echo
          # No artefact is baked into the image, so this must be 0 and the service must
          # still be ready - the model is an enhancement, not a dependency.
          curl -fsS http://127.0.0.1:8000/metrics | grep '^icu_model_loaded'

      - name: the image runs as a non-root user
        run: |
          uid=$(docker exec icu-ci id -u)
          test "$uid" != "0" || { echo "container is running as root"; exit 1; }
          echo "ok: uid $uid"

      - name: logs
        if: always()
        run: docker logs icu-ci || true

      - name: stop
        if: always()
        run: docker rm -f icu-ci || true
